apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

# Scrape targets for components whose install cannot carry its own monitor:
# Traefik (no Service: hostNetwork), ArgoCD (installed by Terraform before
# the Prometheus CRDs exist), cert-manager (wave -5, same reason). They live
# here in the observability namespace and reach across with namespaceSelector;
# Prometheus is configured to honour monitors from every namespace.
# Charts that CAN ship a monitor do (Loki, Tempo, Alloy, RabbitMQ, CNPG).
resources:
  - traefik.yaml
  - argocd.yaml
  - cert-manager.yaml
