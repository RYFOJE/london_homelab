apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.16.2 # check for a newer release
    helm:
      values: |
        crds:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
---
# TODO: add a ClusterIssuer once the Cloudflare token secret exists.
# DNS-01 writes a TXT record to your PUBLIC zone and deletes it. The A
# record stays private in dnsmasq -- that is how you get real Let's Encrypt
# certs without publishing an internal IP.
