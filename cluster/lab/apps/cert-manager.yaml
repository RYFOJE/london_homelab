apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    # >= 1.16.4 required: older releases fail Cloudflare DNS-01 cleanup with
    # "DELETE /zones//dns_records/... 7003" after Cloudflare stopped returning
    # zone_id on DNS records. The challenge validates, then sticks forever.
    targetRevision: v1.21.1
    helm:
      values: |
        crds:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # SSA: the CRDs grew past the last-applied-configuration annotation limit.
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]
---
# ClusterIssuers and the lab wildcard Certificate live in cluster/lab/tls
# (Application "tls", wave 1). The Cloudflare token they need is written by
# Terraform into this namespace (secrets.tf).
