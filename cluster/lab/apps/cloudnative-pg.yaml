# Postgres operator. Replaces the Bitnami subchart, which broke when Bitnami
# pulled versioned tags from their public namespace. CNPG is CNCF, actively
# maintained, and handles backups, failover and major-version upgrades.
# Wave -3: the CRDs must exist before any Cluster resource is applied.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.0
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]
