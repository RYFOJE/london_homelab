# Plain manifests (CNPG Cluster + TCP route), same shape as authentik-db.
# Wave 5: after the CNPG operator (-3) and Traefik (0).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/RYFOJE/london_homelab.git
    targetRevision: HEAD
    path: cluster/lab/database
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
