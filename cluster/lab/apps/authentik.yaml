# Sync wave 10: needs storage, ingress, certs and the database already up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://charts.goauthentik.io
    chart: authentik
    targetRevision: 2026.8.2
    helm:
      values: |
        # Postgres comes from CloudNativePG, not the bundled Bitnami subchart.
        # Recent authentik dropped Redis entirely (tasks moved to Postgres),
        # so there is one less stateful component than the old chart needed.
        postgresql:
          enabled: false

        authentik:
          postgresql:
            host: authentik-db-rw
            name: authentik
            user: authentik
            port: 5432

        # Credentials arrive as env vars from Secrets -- never as values.
        # AUTHENTIK_POSTGRESQL__PASSWORD comes from the Secret CNPG generates.
        # AUTHENTIK_SECRET_KEY comes from the Secret Terraform writes in
        # secrets.tf (random_password kept in tfstate, so it survives rebuilds).
        global:
          env:
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-db-app
                  key: password
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-secret-key
                  key: secret-key

        server:
          ingress:
            enabled: true
            ingressClassName: traefik
            # This chart takes flat lists -- hosts are plain strings and paths
            # are a sibling list, NOT the nginx-style nested
            # hosts[].paths[].path objects most charts use.
            hosts:
              - auth.lab.ryfoje.com
            paths:
              - /
            pathType: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
    # Automated sync does NOT re-attempt a failed sync of the same revision.
    # Depends on CRDs/Secrets from earlier waves; retry instead of sitting red.
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
