# Plain manifests via kustomize: the forward-auth Middleware and the blueprint
# ConfigMap. Wave 6: after Traefik's CRDs (0) so Middleware is a known kind,
# and BEFORE Authentik (10) -- the chart mounts the ConfigMap by name, and a
# pod whose volume does not exist yet sits in ContainerCreating forever.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://github.com/RYFOJE/london_homelab.git
    targetRevision: HEAD
    path: cluster/lab/authentik
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
