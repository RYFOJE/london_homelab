# Plain manifests: Elasticsearch, Kibana, their Ingresses. Wave 22: after the
# ECK operator (8), the forward-auth Middleware (6), and the Prometheus CRDs
# (15) so a ServiceMonitor can be added later without reordering.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elastic
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "22"
spec:
  project: default
  source:
    repoURL: https://github.com/RYFOJE/london_homelab.git
    targetRevision: HEAD
    path: cluster/lab/elastic
  destination:
    server: https://kubernetes.default.svc
    namespace: elastic
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
