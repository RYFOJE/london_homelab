# RabbitMQ Cluster Operator, straight from its git tag. Not the Bitnami
# chart (see cloudnative-pg.yaml for how that ended) and not a vendored copy
# of the 6000-line release manifest.
#
# config/installation is the kustomize overlay the release manifest is built
# from, but the tag in git says "latest"; the image override below pins it to
# the same tag as the source, which is byte-for-byte what the release ships.
# Bump both together.
#
# Wave 8: needs cert-manager (-5) -- the operator's admission webhook gets
# its serving cert from an Issuer in the same manifest.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  source:
    repoURL: https://github.com/rabbitmq/cluster-operator.git
    targetRevision: v2.23.0
    path: config/installation
    kustomize:
      # The selector must be the image name the overlay actually renders.
      # Upstream used to ship rabbitmqoperator/cluster-operator-dev; by v2.23.0
      # config/installation declares ghcr.io/rabbitmq/cluster-operator:latest
      # outright, so the old selector silently matched nothing and the operator
      # ran :latest -- an unpinned image that changes under you on any restart.
      # Verify after bumping: the rendered image must carry the tag, not latest.
      #   kubectl kustomize <this source> | Select-String 'image:'
      images:
        - ghcr.io/rabbitmq/cluster-operator=ghcr.io/rabbitmq/cluster-operator:2.23.0
      # Drop the Namespace the upstream overlay ships. cluster/lab/namespaces
      # already declares rabbitmq-system (wave -20) and owns it -- ArgoCD's
      # tracking-id on the live object says so. Rendering it here too gives one
      # object two owners, and this app then sits at OutOfSync forever while
      # staying Healthy, which also holds the root app OutOfSync. The namespace
      # keeps the labels the chart gave it; nothing re-applies them.
      patches:
        - target:
            kind: Namespace
            name: rabbitmq-system
          patch: |
            $patch: delete
            apiVersion: v1
            kind: Namespace
            metadata:
              name: rabbitmq-system
  destination:
    server: https://kubernetes.default.svc
    namespace: rabbitmq-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # The RabbitmqCluster CRD is far past the last-applied annotation limit.
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
