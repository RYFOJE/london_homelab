# The ClusterSecretStore for Azure Key Vault and every ExternalSecret in the
# lab: one file per namespace in cluster/lab/secrets. That directory IS the
# list of credentials the lab needs -- DEPLOY.md "Secrets" is the same list
# in prose, and scripts/keyvault.ps1 is the same list as code.
#
# Wave -6: after ESO (-8) owns the CRDs and the webhook answers, before
# anything that mounts one of these Secrets (tls at 1 is the first). ArgoCD's
# built-in health for ExternalSecret means a value missing from the vault
# shows up here as Degraded with the vault's error, and every later wave
# waits -- rather than a pod stuck in CreateContainerConfigError three
# waves later.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  project: default
  source:
    repoURL: https://github.com/RYFOJE/london_homelab.git
    targetRevision: HEAD
    path: cluster/lab/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # The webhook is not always ready the instant the ESO app reports
    # Healthy; the first apply can fail validation. Retry instead of red.
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
