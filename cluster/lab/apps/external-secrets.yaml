# External Secrets Operator: copies every lab credential out of Azure Key
# Vault into the Secret each component expects. The store and the list of
# secrets are in cluster/lab/secrets (app "secrets", wave -6); the one
# credential ESO itself needs is written by Terraform (secrets.tf).
#
# Wave -8: after the namespaces (-20), before anything that reads a Secret.
# The earliest consumer is the tls app (1), which needs the Cloudflare token.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.10.0
    helm:
      values: |
        # Three Deployments (controller, webhook, cert-controller); the chart
        # ships no requests at all.
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { memory: 256Mi }
        webhook:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
        certController:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # SSA: the ExternalSecret and SecretStore CRDs are past the 262144-byte
    # last-applied-configuration annotation limit.
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
