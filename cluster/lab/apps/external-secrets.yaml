apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.12.1 # check for a newer release
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
---
# TODO: add a ClusterSecretStore for whatever backing store you use.
# If you have no password manager with an ESO provider, swap this whole
# app for sealed-secrets -- fewer moving parts, but the sealing key is
# generated in-cluster, so back it up or every rebuild invalidates every
# secret in git.
