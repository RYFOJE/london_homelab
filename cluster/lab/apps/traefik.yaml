apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 33.2.1  # check for a newer release
    helm:
      values: |
        # Single node: hostNetwork makes the node IP the ingress IP,
        # which is exactly what dnsmasq points at. No MetalLB needed.
        hostNetwork: true
        deployment:
          # hostNetwork pods get the NODE's resolver by default, which knows
          # nothing about *.svc.cluster.local. Ingress routing never notices
          # (it dials endpoint IPs), but the forward-auth Middleware dials
          # authentik-server.authentik.svc.cluster.local by name and every
          # protected app answers 500 until this is set. Lives under
          # deployment: -- a top-level dnsPolicy is silently dropped.
          dnsPolicy: ClusterFirstWithHostNet
        service:
          enabled: false

        # Traefik must bind :80/:443 directly in the host netns, and
        # Kubernetes has no ambient-capability support -- an added
        # NET_BIND_SERVICE stays in the permitted set and never becomes
        # effective for a non-root process. So it runs as root here.
        # The alternative is setting net.ipv4.ip_unprivileged_port_start=0
        # in the Talos machine config and leaving Traefik non-root.
        podSecurityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["NET_BIND_SERVICE"]

        # hostNetwork means only one pod can hold :80/:443 at a time, so a
        # RollingUpdate deadlocks: the new pod stays Pending waiting for the
        # ports, the old pod never terminates because the new one is not
        # Ready. Recreate accepts a few seconds of downtime instead -- which
        # on a single node is what happens either way.
        updateStrategy:
          type: Recreate
          rollingUpdate: null

        # Write the node IP into every Ingress's status.loadBalancer.
        # Nothing else does it here: publishedService copies status from the
        # Traefik Service, and we disabled that for hostNetwork. Without an
        # address, ArgoCD never marks an Ingress Healthy and the app sits at
        # "Progressing" forever even though routing works fine.
        #
        # Passed as a raw flag on purpose: chart 33.2.1 has no
        # providers.kubernetesIngress.ingressEndpoint key, and Helm silently
        # DISCARDS values it does not recognise -- so setting it there renders
        # nothing and syncs clean. The Traefik binary accepts the flag on every
        # version. Revisit if you upgrade the chart to one that exposes it.
        providers:
          kubernetesIngress:
            publishedService:
              enabled: false
          # One forward-auth Middleware lives in the authentik namespace and
          # every protected Ingress in every other namespace points at it
          # (authentik-authentik-forward-auth@kubernetescrd). Off by default;
          # without it the annotation is silently ignored and the app is open.
          kubernetesCRD:
            allowCrossNamespace: true

        additionalArguments:
          - "--providers.kubernetesingress.ingressendpoint.ip=192.168.18.80"

        # Default certificate for every router on :443. The Secret is the
        # Let's Encrypt wildcard from cluster/lab/tls. Until it is issued
        # Traefik serves its own self-signed cert, so browsers complain for
        # the first couple of minutes after a fresh build and then stop.
        tlsStore:
          default:
            defaultCertificate:
              secretName: lab-wildcard-tls

        ports:
          web:
            port: 80
            # Everything on :80 becomes a 301 to :443. Ingresses need no
            # tls: block: websecure.tls.enabled (chart default) makes every
            # router on 443 terminate TLS with the default cert above.
            redirectTo:
              port: websecure
              permanent: true
          websecure:
            port: 443
          # Chart default is 9100 -- the same host port node-exporter binds
          # (also hostNetwork). The scheduler treats containerPort as hostPort
          # for hostNetwork pods, so after every node reboot whichever of the
          # two lands first wins and the other sits Pending with "didn't have
          # free ports". Nothing scrapes Traefik's metrics yet; just move them.
          metrics:
            port: 9101
          # Raw TCP for the dev databases. hostNetwork means these bind on the
          # node IP directly, so a laptop on the LAN reaches Postgres at
          # 192.168.18.80:5432 and AMQP at :5672 with no NodePort remapping.
          # Routing is an IngressRouteTCP with HostSNI("*") next to each
          # service (cluster/lab/database, cluster/lab/messaging).
          postgres:
            port: 5432
            protocol: TCP
            expose:
              default: true
            exposedPort: 5432
          amqp:
            port: 5672
            protocol: TCP
            expose:
              default: true
            exposedPort: 5672
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
    # Talos enforces PodSecurity "baseline" on every namespace by default.
    # This workload cannot run under it, so exempt just this namespace.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
