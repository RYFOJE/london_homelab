# rabbitmq_prometheus is on by default and the operator names the port
# "prometheus". PodMonitor rather than ServiceMonitor: the operator's docs
# pattern, and it keeps working if the Service is ever recreated.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: rabbitmq
  namespace: messaging
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: rabbitmq
  podMetricsEndpoints:
    - port: prometheus
      interval: 30s
