# Management UI. Authentik gates the page; RabbitMQ then asks for its own
# login (it has no header-auth mode), credentials in rabbitmq-default-user:
#   kubectl -n messaging get secret rabbitmq-default-user -o jsonpath='{.data.password}' | base64 -d
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rabbitmq-management
  namespace: messaging
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forward-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: rabbitmq.lab.ryfoje.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rabbitmq
                port:
                  number: 15672
