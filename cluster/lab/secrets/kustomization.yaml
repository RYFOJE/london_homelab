apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace: here on purpose -- every ExternalSecret names its own, and
# the store is cluster-scoped.
#
# Adding a credential: put it in Key Vault (scripts/keyvault.ps1 catalog),
# add an ExternalSecret to the file for its namespace, add the row to
# DEPLOY.md "Secrets". Three places, always together.
resources:
  - clustersecretstore.yaml
  - argocd.yaml
  - authentik.yaml
  - cert-manager.yaml
  - database.yaml
  - dev.yaml
  - elastic.yaml
  - observability.yaml
