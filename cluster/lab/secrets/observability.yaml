# Grafana's break-glass admin (user: admin). SSO via Authentik is layered on
# top; this login stays enabled forever so a broken Authentik cannot lock
# you out of the metrics that explain why it broke. kube-prometheus-stack
# reads it via grafana.admin.existingSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: azure-keyvault }
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: grafana-admin-password }
---
# Grafana <-> Authentik OIDC client. Grafana loads the whole Secret as env
# (grafana.envFromSecret), so the keys are the GF_ variable names. The
# Authentik side reads the same vault entry through authentik-blueprint-env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: azure-keyvault }
  target:
    name: grafana-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef: { key: grafana-oidc-client-secret }
