# pgAdmin's bootstrap admin password. Nobody types it -- every real login is
# an Authentik header -- but the container refuses to start without one.
# The dev Postgres itself needs nothing here: CNPG generates dev-db-app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin-admin
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: azure-keyvault }
  target:
    name: pgadmin-admin
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef: { key: pgadmin-admin-password }
