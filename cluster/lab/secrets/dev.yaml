# Valkey password. Needed even in a lab: :6379 is exposed on the LAN through
# Traefik (cluster/lab/dev/ingressroute-tcp.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-auth
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: azure-keyvault }
  target:
    name: valkey-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef: { key: valkey-password }
