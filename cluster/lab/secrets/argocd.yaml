# ArgoCD <-> Authentik OIDC client secret. ArgoCD reads it through the
# $argocd-oidc:oidc.clientSecret reference in terraform/bootstrap.tf, which
# only resolves for Secrets labelled app.kubernetes.io/part-of=argocd --
# hence the template. Authentik's blueprint gets the same vault value via
# authentik-blueprint-env (authentik.yaml here).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: azure-keyvault }
  target:
    name: argocd-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      data:
        oidc.clientSecret: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef: { key: argocd-oidc-client-secret }
