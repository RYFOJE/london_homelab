# Cloudflare API token for the DNS-01 solver. The only vault entry that is
# not generated: it comes from the Cloudflare dashboard (DEPLOY.md 1b) and
# scripts/keyvault.ps1 prompts for it. Both ClusterIssuers in cluster/lab/tls
# reference this Secret by name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: azure-keyvault }
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef: { key: cloudflare-api-token }
