# Authentik's signing key. Regenerating it invalidates every session and
# every user's stable ID -- treat the vault entry as permanent.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secret-key
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: azure-keyvault }
  target:
    name: authentik-secret-key
    creationPolicy: Owner
  data:
    - secretKey: secret-key
      remoteRef: { key: authentik-secret-key }
---
# Values the blueprints read via !Env (cluster/lab/apps/authentik.yaml maps
# each key to an env var on the worker). The two OIDC client secrets also
# land on the client side: grafana-oidc in observability and argocd-oidc in
# argocd -- one value, two Secrets, no copying by hand. akadmin-password is
# blueprint-only (akadmin.yaml), skipping the manual initial-setup flow.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-env
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: azure-keyvault }
  target:
    name: authentik-blueprint-env
    creationPolicy: Owner
  data:
    - secretKey: grafana-oidc-client-secret
      remoteRef: { key: grafana-oidc-client-secret }
    - secretKey: argocd-oidc-client-secret
      remoteRef: { key: argocd-oidc-client-secret }
    - secretKey: akadmin-password
      remoteRef: { key: akadmin-password }
