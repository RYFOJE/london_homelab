# Kibana's anonymous provider signs every visitor in as this Elasticsearch
# file-realm user, so the Authentik forward-auth page is the only login.
# ECK reads a kubernetes.io/basic-auth Secret (username/password/roles) to
# create the user; Kibana reads the password back via env. superuser because
# Authentik already gates who can reach Kibana at all.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kibana-anonymous
  namespace: elastic
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: azure-keyvault }
  target:
    name: kibana-anonymous
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: kibana-anon
        password: "{{ .password }}"
        roles: superuser
  data:
    - secretKey: password
      remoteRef: { key: kibana-anonymous-password }
