# The ESO Key Vault -- every lab credential EXCEPT the ones Terraform reads
# directly (those live in a separate, Terraform-only vault; see secrets.tf).
# Two vaults so the service principal below, if it were ever compromised,
# cannot read the Proxmox token or its own login credential.
#
# Auth is a service principal with "Key Vault Secrets User" on THIS vault
# only (scripts/keyvault.ps1 creates both). Workload identity would avoid the
# client secret, but Azure has to fetch the cluster's OIDC discovery document
# to trust it, and a LAN-only Talos node cannot serve one.
#
# The client id/secret Secret is the ONE thing Terraform writes into the
# cluster (terraform/secrets.tf): it reads them out of the Terraform vault
# with your `az login` and puts them in the argocd namespace, the only
# namespace Terraform can rely on existing.
#
# tenantId and vaultUrl are not secrets, but they are yours: change them
# here and in terraform.tfvars together (README "Hard-coded in more than one
# place").
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azurekv:
      authType: ServicePrincipal
      tenantId: 042959ea-c0c4-4f90-bb30-e0e2da9f14af
      vaultUrl: https://kv-ryfoje-eso.vault.azure.net
      authSecretRef:
        clientId:
          name: azure-keyvault-creds
          namespace: argocd
          key: client-id
        clientSecret:
          name: azure-keyvault-creds
          namespace: argocd
          key: client-secret
