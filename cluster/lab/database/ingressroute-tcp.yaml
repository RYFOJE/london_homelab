# Raw TCP passthrough on the "postgres" entrypoint traefik.yaml opens on
# :5432. Postgres does not speak TLS-SNI at connect time, so HostSNI("*") is
# the only match that works -- one Postgres per port.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: postgres
  namespace: database
spec:
  entryPoints: [postgres]
  routes:
    - match: HostSNI(`*`)
      services:
        - name: dev-db-rw
          port: 5432
