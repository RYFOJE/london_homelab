# ArgoCD logs in with OIDC directly (no Dex). The issuer ArgoCD uses is
# https://auth.lab.ryfoje.com/application/o/argocd/ -- the application slug
# below is part of that URL, so do not rename it without changing
# bootstrap.tf. Client secret: Key Vault -> authentik-blueprint-env Secret
# (cluster/lab/secrets) -> env var on the worker, same mechanism as
# grafana.yaml.
#
# ArgoCD's RBAC (bootstrap.tf) maps the argocd-admins group to role:admin
# and everyone else to read-only. The local "admin" login stays as
# break-glass.
version: 1
metadata:
  name: argocd-oidc
  labels:
    blueprints.goauthentik.io/description: ArgoCD OAuth2 provider, application and admin group
entries:
  # Membership is the access list: only this group passes the policy
  # binding at the bottom. Add users here (durable) or in the admin UI
  # (Directory -> Groups); a UI change is reset when this file changes.
  - model: authentik_core.group
    id: argocd-admins
    identifiers:
      name: argocd-admins
    attrs:
      users:
        - !Find [authentik_core.user, [username, akadmin]]

  - model: authentik_providers_oauth2.oauth2provider
    id: argocd-provider
    identifiers:
      name: argocd
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: argocd
      client_secret: !Env ARGOCD_OIDC_CLIENT_SECRET
      # Authentik >= 2025.x gates every grant per provider. The UI defaults
      # this list; blueprints do NOT (empty list = every login fails with
      # "invalid_request: The request is otherwise malformed"). Set it.
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://argocd.lab.ryfoje.com/auth/callback
        # `argocd login --sso` from a laptop.
        - matching_mode: strict
          url: http://localhost:8085/auth/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        # profile carries the `groups` claim ArgoCD's RBAC keys on.
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: argocd-app
    identifiers:
      slug: argocd
    attrs:
      name: ArgoCD
      provider: !KeyOf argocd-provider
      meta_launch_url: https://argocd.lab.ryfoje.com
      meta_description: GitOps

  # Access control. Without a binding every Authentik user can authorize
  # (and land in ArgoCD as read-only). With one, non-members get
  # Authentik's "access denied" page and never reach ArgoCD.
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf argocd-app
      group: !KeyOf argocd-admins
    attrs:
      enabled: true
