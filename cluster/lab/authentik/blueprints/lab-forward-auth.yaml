# Domain-level forward auth for every *.lab.ryfoje.com web UI that has no SSO
# of its own (pgAdmin, Kibana, RabbitMQ management, ...).
#
# One provider in forward_domain mode means one login cookie for the whole
# lab domain and NO per-app route for /outpost.goauthentik.io -- the callback
# lands on auth.lab.ryfoje.com, which the authentik server already serves.
# Protecting a new app is a single Ingress annotation (see middleware.yaml).
#
# Trade-off: one authorization policy for all of them. Anyone who can log in
# to Authentik can reach every forward-auth app. Fine for a personal lab.
version: 1
metadata:
  name: lab-forward-auth
  labels:
    blueprints.goauthentik.io/description: Traefik forward auth for *.lab.ryfoje.com
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: lab-forward-auth-provider
    identifiers:
      name: lab-forward-auth
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_domain
      # In domain mode this is the authentik URL itself, not an app URL.
      external_host: http://auth.lab.ryfoje.com
      cookie_domain: lab.ryfoje.com
      access_token_validity: hours=24

  - model: authentik_core.application
    identifiers:
      slug: lab-forward-auth
    attrs:
      name: Lab services
      provider: !KeyOf lab-forward-auth-provider
      meta_description: Forward-auth gate for pgAdmin, Kibana and RabbitMQ

  # Bind the provider to the outpost that ships inside authentik-server. The
  # `managed` identifier is how authentik names the embedded outpost, so this
  # updates it rather than creating a second one.
  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      name: authentik Embedded Outpost
      type: proxy
      providers:
        - !KeyOf lab-forward-auth-provider
      config:
        # Where browsers are sent to log in. The outpost talks to the API
        # in-process, so this only has to resolve from the LAN.
        authentik_host: http://auth.lab.ryfoje.com
        authentik_host_insecure: true
