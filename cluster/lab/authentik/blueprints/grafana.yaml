# Grafana logs in with real OIDC (it supports it natively), so it gets its
# own OAuth2 provider rather than the forward-auth gate.
#
# The client secret lives in Key Vault and reaches this file as an env var
# on the worker -- cluster/lab/secrets pulls it into authentik-blueprint-env,
# and global.env in authentik.yaml maps that to GRAFANA_OIDC_CLIENT_SECRET.
# Grafana gets the same value through the grafana-oidc Secret. Nothing
# secret is in git.
#
# Group -> Grafana role mapping lives on the Grafana side
# (role_attribute_path in kube-prometheus-stack.yaml): grafana-admins ->
# Admin, grafana-editors -> Editor, everyone else Viewer.
version: 1
metadata:
  name: grafana-oidc
  labels:
    blueprints.goauthentik.io/description: Grafana OAuth2 provider, application and role groups
entries:
  # Membership is the access list: only these two groups pass the policy
  # bindings at the bottom. Add users here (durable) or in the admin UI
  # (Directory -> Groups); a UI change is reset when this file changes.
  - model: authentik_core.group
    id: grafana-admins
    identifiers:
      name: grafana-admins
    attrs:
      users:
        - !Find [authentik_core.user, [username, akadmin]]

  - model: authentik_core.group
    id: grafana-editors
    identifiers:
      name: grafana-editors
    attrs: {}

  - model: authentik_providers_oauth2.oauth2provider
    id: grafana-provider
    identifiers:
      name: grafana
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: grafana
      client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
      # Authentik >= 2025.x gates every grant per provider. The UI defaults
      # this list; blueprints do NOT (empty list = "Login provider denied
      # login request" in Grafana). Set it.
      grant_types:
        - authorization_code
        - refresh_token
      # Must match Grafana's root_url scheme exactly (strict matching).
      redirect_uris:
        - matching_mode: strict
          url: https://grafana.lab.ryfoje.com/login/generic_oauth
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: grafana-app
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      provider: !KeyOf grafana-provider
      meta_launch_url: https://grafana.lab.ryfoje.com
      meta_description: Metrics, logs and traces

  # Access control. Bindings on an application are OR'd (policy engine
  # mode "any"): admins or editors pass, everyone else gets Authentik's
  # "access denied" page and never reaches Grafana.
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf grafana-app
      group: !KeyOf grafana-admins
    attrs:
      enabled: true

  - model: authentik_policies.policybinding
    identifiers:
      order: 10
      target: !KeyOf grafana-app
      group: !KeyOf grafana-editors
    attrs:
      enabled: true
