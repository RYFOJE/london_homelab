# Valkey (Redis-compatible) for sessions, caching, rate limiting. Plain
# manifests: the only maintained charts are Bitnami's, and the repo already
# learned that lesson (cloudnative-pg.yaml). Password comes from Key Vault
# (Secret dev/valkey-auth, cluster/lab/secrets/dev.yaml) because :6379 is
# also exposed on the LAN through Traefik (see ingressroute-tcp.yaml).
#
# In-cluster: valkey.dev.svc.cluster.local:6379   LAN: 192.168.18.80:6379
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: dev
  labels:
    app.kubernetes.io/name: valkey
spec:
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: dev
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
      containers:
        - name: valkey
          image: valkey/valkey:8.1.10-alpine
          args:
            - valkey-server
            - --requirepass
            - $(VALKEY_PASSWORD)
            # Durable enough for a dev cache: AOF plus a snapshot every
            # minute if anything changed.
            - --appendonly
            - "yes"
            - --save
            - 60 1
            - --maxmemory
            - 192mb
            - --maxmemory-policy
            - allkeys-lru
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-auth
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: [sh, -c, "valkey-cli -a \"$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
